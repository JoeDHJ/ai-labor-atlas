name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing, published GitHub release tag to publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

concurrency:
  group: pypi-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate the published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the stable vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          release_json="$RUNNER_TEMP/release.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$release_json"
          jq --exit-status --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and (.draft | not) and (.prerelease | not)' \
            "$release_json" > /dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - name: Build distributions
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Validate distribution metadata
        shell: bash
        run: |
          python - <<'PY'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          expected_name = "ai-labor-atlas"
          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_path))
          assert metadata["Name"] == expected_name, metadata["Name"]
          assert metadata["Version"] == expected_version, metadata["Version"]

          with tarfile.open(sdists[0], "r:gz") as archive:
              pyproject_path = next(
                  member for member in archive.getmembers() if member.name.endswith("/pyproject.toml")
              )
              pyproject = archive.extractfile(pyproject_path)
              assert pyproject is not None
              text = pyproject.read().decode("utf-8")
          assert f'version = "{expected_version}"' in text
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/ai-labor-atlas/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions-${{ env.RELEASE_TAG }}
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: dist/
          attestations: true
