name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,excel]" -c constraints-ci.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests tools
      - run: python -m ruff check .

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,excel]" -c constraints-ci.txt
      - run: python tools/audit_500_atlas_scenarios.py

  release-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install "dist/"*.whl openpyxl
      - name: Run the installed distribution outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          atlas build --demo
          atlas analyze > atlas-analysis.json
          atlas search software > atlas-search.json
          python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          import ai_labor_atlas

          analysis = json.loads(Path("atlas-analysis.json").read_text())
          assert version("ai-labor-atlas") == ai_labor_atlas.__version__ == "0.4.0"
          assert analysis["summary"]["rows"] == 8
          matches = json.loads(Path("atlas-search.json").read_text())
          assert any(item["title"] == "Software Developers" for item in matches)
          assert Path("data/processed/occupations.csv").exists()
          PY
      - name: Rebuild and run from the source distribution
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install "dist/"*.tar.gz openpyxl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-env/bin/atlas" build --demo
          "$RUNNER_TEMP/sdist-env/bin/atlas" search software > atlas-sdist-search.json
