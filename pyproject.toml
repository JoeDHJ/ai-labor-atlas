[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-labor-atlas"
version = "0.4.0"
description = "A reproducible, descriptive atlas of occupations, AI exposure, wages, and employment."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "AI Labor Atlas contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/JoeDHJ/ai-labor-atlas"
Repository = "https://github.com/JoeDHJ/ai-labor-atlas"
Issues = "https://github.com/JoeDHJ/ai-labor-atlas/issues"

[project.optional-dependencies]
excel = ["openpyxl==3.1.5"]
dev = ["pytest==9.1.1", "ruff==0.15.22"]

[project.scripts]
atlas = "ai_labor_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_labor_atlas.resources" = ["*.json"]
